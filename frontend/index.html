<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>pulses</title>
    <style>
        :root { color-scheme: light; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 2rem;
            background: #f9f9f7;
            color: #0b0b0b;
        }
        .viz-root {
            --surface-1: #fcfcfb;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #898781;
            --gridline: #e1e0d9;
            --baseline: #c3c2b7;
            --series-1: #2a78d6;
            --series-2: #eb6834;
            --series-3: #1baf7a;
            --series-4: #eda100;
            --border: rgba(11, 11, 11, 0.10);
        }
        @media (prefers-color-scheme: dark) {
            :root:where(:not([data-theme="light"])) body { background: #0d0d0d; color: #ffffff; }
            :root:where(:not([data-theme="light"])) .viz-root {
                color-scheme: dark;
                --surface-1: #1a1a19;
                --text-primary: #ffffff;
                --text-secondary: #c3c2b7;
                --text-muted: #898781;
                --gridline: #2c2c2a;
                --baseline: #383835;
                --series-1: #3987e5;
                --series-2: #d95926;
                --series-3: #199e70;
                --series-4: #c98500;
                --border: rgba(255, 255, 255, 0.10);
            }
        }
        :root[data-theme="dark"] body { background: #0d0d0d; color: #ffffff; }
        :root[data-theme="dark"] .viz-root {
            color-scheme: dark;
            --surface-1: #1a1a19;
            --text-primary: #ffffff;
            --text-secondary: #c3c2b7;
            --text-muted: #898781;
            --gridline: #2c2c2a;
            --baseline: #383835;
            --series-1: #3987e5;
            --series-2: #d95926;
            --series-3: #199e70;
            --series-4: #c98500;
            --border: rgba(255, 255, 255, 0.10);
        }

        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.1rem; color: var(--text-secondary, #52514e); margin-top: 2rem; }

        #chart {
            position: relative;
            background: var(--surface-1, #fcfcfb);
            border: 1px solid var(--border, rgba(11,11,11,0.10));
            border-radius: 8px;
            padding: 16px;
            max-width: 760px;
        }
        #chart-svg { width: 100%; height: auto; display: block; }
        #chart-svg .gridline { stroke: var(--gridline, #e1e0d9); stroke-width: 1; }
        #chart-svg .baseline { stroke: var(--baseline, #c3c2b7); stroke-width: 1; }
        #chart-svg .axis-label { fill: var(--text-muted, #898781); font-size: 11px; }
        #chart-svg .axis-title { fill: var(--text-secondary, #52514e); font-size: 12px; }
        #chart-svg .end-label { fill: var(--text-secondary, #52514e); font-size: 12px; }
        #chart-svg .crosshair { stroke: var(--text-muted, #898781); stroke-width: 1; pointer-events: none; transition: opacity .1s; }

        #chart-legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0 4px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary, #52514e); }
        .legend-swatch { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }

        #chart-tooltip {
            position: absolute;
            min-width: 140px;
            background: var(--surface-1, #fcfcfb);
            border: 1px solid var(--border, rgba(11,11,11,0.10));
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            color: var(--text-primary, #0b0b0b);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }
        .tooltip-title { color: var(--text-secondary, #52514e); font-weight: 600; margin-bottom: 4px; }
        .tooltip-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .tooltip-key { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
        .tooltip-id { color: var(--text-secondary, #52514e); margin-left: auto; }

        table { border-collapse: collapse; width: 100%; max-width: 760px; margin-top: 0.5rem; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; font-variant-numeric: tabular-nums; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
    <h1>Pulsations</h1>

    <h2>Graphique</h2>
    <div class="viz-root">
        <div id="chart">
            <svg id="chart-svg" role="img" aria-label="Evolution du BPM par nombre de battements"></svg>
            <div id="chart-tooltip" hidden></div>
        </div>
        <div id="chart-legend"></div>
    </div>

    <h2>Tableau</h2>
    <table>
        <thead>
            <tr><th>ID</th><th>Pulse 1</th><th>Pulse 2</th><th>Pulse 3</th><th>Pulse 4</th></tr>
        </thead>
        <tbody id="corps-tableau"></tbody>
    </table>

    <script>
        const SVG_NS = "http://www.w3.org/2000/svg";

        function svgEl(name, attrs) {
            const el = document.createElementNS(SVG_NS, name);
            for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
            return el;
        }

        function niceTicks(min, max, count) {
            if (min === max) { min -= 1; max += 1; }
            const span = max - min;
            const rawStep = span / count;
            const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
            const residual = rawStep / magnitude;
            let step;
            if (residual > 5) step = 10 * magnitude;
            else if (residual > 2) step = 5 * magnitude;
            else if (residual > 1) step = 2 * magnitude;
            else step = magnitude;
            const niceMin = Math.floor(min / step) * step;
            const niceMax = Math.ceil(max / step) * step;
            const ticks = [];
            for (let v = niceMin; v <= niceMax + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
            return ticks;
        }

        function parseSeries(rows) {
            return rows.map(row => {
                let id = "";
                const points = [];
                for (const key of Object.keys(row)) {
                    const trimmedKey = key.trim();
                    if (trimmedKey === "id") {
                        id = (row[key] ?? "").toString().trim();
                        continue;
                    }
                    const match = /^pulse(\d+)$/.exec(trimmedKey);
                    if (!match) continue;
                    const raw = (row[key] ?? "").toString().trim();
                    if (raw === "") continue;
                    const bpm = parseFloat(raw);
                    if (Number.isNaN(bpm)) continue;
                    points.push({ beat: parseInt(match[1], 10), bpm });
                }
                points.sort((a, b) => a.beat - b.beat);
                return { id, points };
            }).filter(s => s.points.length > 0);
        }

        function renderTable(rows) {
            const corps = document.getElementById("corps-tableau");
            corps.innerHTML = "";
            for (const row of rows) {
                const get = (name) => {
                    const key = Object.keys(row).find(k => k.trim() === name);
                    return key ? (row[key] ?? "").toString().trim() : "";
                };
                const tr = document.createElement("tr");
                const cells = [get("id"), get("pulse1"), get("pulse2"), get("pulse3"), get("pulse4")];
                cells.forEach((value, i) => {
                    const td = document.createElement("td");
                    td.textContent = i === 0 || value === "" ? value : `${value} bpm`;
                    tr.appendChild(td);
                });
                corps.appendChild(tr);
            }
        }

        function renderChart(series) {
            const svg = document.getElementById("chart-svg");
            const chartEl = document.getElementById("chart");
            const tooltip = document.getElementById("chart-tooltip");
            const legend = document.getElementById("chart-legend");
            svg.innerHTML = "";
            legend.innerHTML = "";

            if (series.length === 0) {
                chartEl.hidden = true;
                return;
            }
            chartEl.hidden = false;

            const width = 720, height = 420;
            const margin = { top: 24, right: 108, bottom: 48, left: 56 };
            const plotW = width - margin.left - margin.right;
            const plotH = height - margin.top - margin.bottom;

            const beats = [...new Set(series.flatMap(s => s.points.map(p => p.beat)))].sort((a, b) => a - b);
            const minBeat = beats[0], maxBeat = beats[beats.length - 1];
            const bpmValues = series.flatMap(s => s.points.map(p => p.bpm));
            const rawMin = Math.min(...bpmValues), rawMax = Math.max(...bpmValues);
            const pad = (rawMax - rawMin) * 0.1 || 5;
            const yTicks = niceTicks(rawMin - pad, rawMax + pad, 5);
            const yMin = yTicks[0], yMax = yTicks[yTicks.length - 1];

            const xScale = (beat) => margin.left + (maxBeat === minBeat ? plotW / 2 : (beat - minBeat) / (maxBeat - minBeat) * plotW);
            const yScale = (bpm) => margin.top + plotH - (bpm - yMin) / (yMax - yMin) * plotH;

            svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

            for (const t of yTicks) {
                const y = yScale(t);
                svg.appendChild(svgEl("line", { x1: margin.left, x2: width - margin.right, y1: y, y2: y, class: "gridline" }));
                const label = svgEl("text", { x: margin.left - 10, y: y + 4, class: "axis-label", "text-anchor": "end" });
                label.textContent = String(Math.round(t));
                svg.appendChild(label);
            }

            const baseY = margin.top + plotH;
            svg.appendChild(svgEl("line", { x1: margin.left, x2: width - margin.right, y1: baseY, y2: baseY, class: "baseline" }));
            for (const b of beats) {
                const x = xScale(b);
                const label = svgEl("text", { x, y: baseY + 20, class: "axis-label", "text-anchor": "middle" });
                label.textContent = String(b);
                svg.appendChild(label);
            }

            const xTitle = svgEl("text", { x: margin.left + plotW / 2, y: height - 4, class: "axis-title", "text-anchor": "middle" });
            xTitle.textContent = "Nombre de battements";
            svg.appendChild(xTitle);

            const yTitle = svgEl("text", {
                x: 16, y: margin.top + plotH / 2, class: "axis-title", "text-anchor": "middle",
                transform: `rotate(-90 16 ${margin.top + plotH / 2})`
            });
            yTitle.textContent = "BPM";
            svg.appendChild(yTitle);

            const endLabels = [];
            series.forEach((s, i) => {
                const colorVar = `var(--series-${(i % 4) + 1})`;
                const d = s.points.map((p, idx) => `${idx === 0 ? "M" : "L"} ${xScale(p.beat)},${yScale(p.bpm)}`).join(" ");
                svg.appendChild(svgEl("path", { d, fill: "none", stroke: colorVar, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));

                const last = s.points[s.points.length - 1];
                const lx = xScale(last.beat), ly = yScale(last.bpm);
                svg.appendChild(svgEl("circle", { cx: lx, cy: ly, r: 6, fill: "var(--surface-1)" }));
                svg.appendChild(svgEl("circle", { cx: lx, cy: ly, r: 4, fill: colorVar }));

                endLabels.push({ x: lx + 10, y: ly, color: colorVar, text: `ID ${s.id}` });

                const item = document.createElement("div");
                item.className = "legend-item";
                const swatch = document.createElement("span");
                swatch.className = "legend-swatch";
                swatch.style.background = colorVar;
                const text = document.createElement("span");
                text.textContent = `ID ${s.id}`;
                item.appendChild(swatch);
                item.appendChild(text);
                legend.appendChild(item);
            });

            endLabels.sort((a, b) => a.y - b.y);
            const minGap = 14;
            for (let i = 1; i < endLabels.length; i++) {
                if (endLabels[i].y - endLabels[i - 1].y < minGap) {
                    endLabels[i].y = endLabels[i - 1].y + minGap;
                }
            }
            for (const el of endLabels) {
                svg.appendChild(svgEl("line", { x1: el.x, x2: el.x + 10, y1: el.y, y2: el.y, stroke: el.color, "stroke-width": 2, "stroke-linecap": "round" }));
                const label = svgEl("text", { x: el.x + 14, y: el.y + 4, class: "end-label" });
                label.textContent = el.text;
                svg.appendChild(label);
            }

            const crosshair = svgEl("line", { x1: 0, x2: 0, y1: margin.top, y2: baseY, class: "crosshair" });
            crosshair.style.opacity = 0;
            svg.appendChild(crosshair);

            function showTooltip(beat, x) {
                crosshair.setAttribute("x1", x);
                crosshair.setAttribute("x2", x);
                crosshair.style.opacity = 1;

                tooltip.innerHTML = "";
                const title = document.createElement("div");
                title.className = "tooltip-title";
                title.textContent = `Battement ${beat}`;
                tooltip.appendChild(title);

                series.forEach((s, i) => {
                    const point = s.points.find(p => p.beat === beat);
                    if (!point) return;
                    const row = document.createElement("div");
                    row.className = "tooltip-row";
                    const key = document.createElement("span");
                    key.className = "tooltip-key";
                    key.style.background = `var(--series-${(i % 4) + 1})`;
                    const value = document.createElement("strong");
                    value.textContent = `${point.bpm} bpm`;
                    const idLabel = document.createElement("span");
                    idLabel.className = "tooltip-id";
                    idLabel.textContent = `ID ${s.id}`;
                    row.appendChild(key);
                    row.appendChild(value);
                    row.appendChild(idLabel);
                    tooltip.appendChild(row);
                });

                const chartRect = chartEl.getBoundingClientRect();
                const scaleX = chartRect.width / width;
                const left = x * scaleX + 12;
                tooltip.style.left = `${Math.min(left, chartRect.width - 160)}px`;
                tooltip.style.top = `${margin.top}px`;
                tooltip.hidden = false;
            }

            function hideTooltip() {
                tooltip.hidden = true;
                crosshair.style.opacity = 0;
            }

            const colWidth = beats.length > 1 ? plotW / (beats.length - 1) : plotW;
            beats.forEach((b) => {
                const x = xScale(b);
                const left = beats.length > 1 ? x - colWidth / 2 : margin.left;
                const w = beats.length > 1 ? colWidth : plotW;
                const hit = svgEl("rect", {
                    x: left, y: margin.top, width: w, height: plotH,
                    fill: "transparent", tabindex: 0, role: "img",
                    "aria-label": `Battement ${b}`
                });
                hit.addEventListener("pointerenter", () => showTooltip(b, x));
                hit.addEventListener("pointermove", () => showTooltip(b, x));
                hit.addEventListener("pointerleave", hideTooltip);
                hit.addEventListener("focus", () => showTooltip(b, x));
                hit.addEventListener("blur", hideTooltip);
                svg.appendChild(hit);
            });
        }

        async function loadPulses() {
            const reponse = await fetch("http://127.0.0.1:8000/api/pulses/");
            const data = await reponse.json();
            const rows = data.pulses || [];
            renderTable(rows);
            renderChart(parseSeries(rows));
        }
        loadPulses();
    </script>
</body>
</html>
