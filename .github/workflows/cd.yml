name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["*.*.*"]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REF='${{ github.event.workflow_run.head_branch }}'
          SHA='${{ github.event.workflow_run.head_sha }}'
          IMAGE_TAG="$REF"

          echo "CI succeeded on ${REF} (commit ${SHA})."
          echo "Images published:"
          echo "  ghcr.io/${OWNER}/webapp-backend:${IMAGE_TAG}"
          echo "  ghcr.io/${OWNER}/webapp-frontend:${IMAGE_TAG}"
          echo "  ghcr.io/${OWNER}/webapp-backend:${SHA}"
          echo "  ghcr.io/${OWNER}/webapp-frontend:${SHA}"
          echo ""
          echo "No deployment target is configured yet."
          echo "To deploy for real, on the target server run:"
          echo "  docker compose pull && docker compose up -d"
