name: CD

on:
  push:
    tags: ['*.*.*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: pip install -r ./requirements.txt

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/webapp-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/api/health && break
            echo "backend not ready yet, retrying..."
            sleep 2
          done

      - name: Check backend health endpoint
        run: curl -sf http://127.0.0.1:8000/api/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REF='${{ github.ref_name }}'
          SHA='${{ github.sha }}'

          echo "CD succeeded on tag ${REF} (commit ${SHA})."
          echo "Images published:"
          echo "  ghcr.io/${OWNER}/webapp-backend:${REF}"
          echo "  ghcr.io/${OWNER}/webapp-backend:${SHA}"
          echo ""
          echo "No deployment target is configured yet."
          echo "To deploy for real, on the target server run:"
          echo "  docker compose pull && docker compose up -d"
